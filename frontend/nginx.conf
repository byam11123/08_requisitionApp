server {
    listen 80;
    server_name localhost;
    
    # Increase upload size limit to 50MB
    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API calls if using same domain.
    # On Render with separate services, we rely on full VITE_API_URL in the frontend code.
    # If we really need proxying, we must use a resolver or the correct service name.
    # For now, we'll comment this out to allow Nginx to start. 
    # The React app should use the full URL from VITE_API_URL.
    
    # Proxy API calls to backend to avoid CORS and handle runtime URL resolution
    location /api/ {
        # Using the Render service name "requisition-backend" and port 8080 (from render.yaml PORT env var)
        proxy_pass http://requisition-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /ws {
    #     proxy_pass http://requisition-backend:8081/ws;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";
    #     proxy_set_header Host $host;
    # }
}

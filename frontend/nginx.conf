server {
    listen 80;
    server_name localhost;
    
    # Increase upload size limit to 50MB
    client_max_body_size 50M;

    # SPA routing - serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend using the known public URL
    # Using resolver to handle dynamic DNS (required for external hostnames)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    location /api/ {
        # Hardcoded backend URL (matches your Render backend service)
        set $backend "https://requisition-backend-egoa.onrender.com";
        proxy_pass $backend/api/;
        
        # Required for proxying to HTTPS
        proxy_ssl_server_name on;
        
        # CRITICAL: Forward the correct host for Render's load balancer
        proxy_set_header Host requisition-backend-egoa.onrender.com;
        
        # CRITICAL: Forward Origin header for CORS (browser sets this)
        proxy_set_header Origin $http_origin;
        
        # Standard proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Forward all other headers (including Authorization, Content-Type)
        proxy_pass_request_headers on;
        
        # Timeouts for slow cold starts on free tier
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
